name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JACOCO: org.jacoco:jacoco-maven-plugin:0.8.12

jobs:
  backend:
    name: Backend (mvn verify + JaCoCo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # JaCoCo is invoked from the CLI so no pom change is needed; if the pom already
      # binds prepare-agent (PR #1), the extra invocation is harmless and pom thresholds still apply.
      - name: mvn verify
        run: mvn -B ${JACOCO}:prepare-agent verify ${JACOCO}:report
      - name: Upload JaCoCo reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: '**/target/site/jacoco/'
          if-no-files-found: ignore
      - name: Upload surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'
          if-no-files-found: ignore

  frontend:
    name: Frontend build (erp-web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect erp-web
        id: detect
        run: |
          if [ -f erp-web/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "erp-web/package.json not found, skipping"; fi
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.present == 'true' && hashFiles('erp-web/package-lock.json') != ''
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: erp-web/package-lock.json
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.present == 'true' && hashFiles('erp-web/package-lock.json') == ''
        with:
          node-version: '22'
      - name: Install, test & build
        if: steps.detect.outputs.present == 'true'
        working-directory: erp-web
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm test
          npm run build

  mysql-smoke:
    name: MySQL smoke (mysql profile)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root123
          MYSQL_DATABASE: erp
          MYSQL_USER: erp
          MYSQL_PASSWORD: erp123
          TZ: Asia/Shanghai
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -uerp -perp123 --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Package (skip tests)
        run: mvn -B -DskipTests package
      - name: Start app with mysql profile
        env:
          SPRING_PROFILES_ACTIVE: mysql
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: '3306'
          MYSQL_USER: erp
          MYSQL_PASSWORD: erp123
        run: |
          nohup java -jar erp-boot/target/erp-boot-*.jar > app.log 2>&1 &
          # 就绪探测：/actuator/health 免登录，返回 200 且 status=UP 即就绪
          ready=false
          for i in $(seq 1 60); do
            body=$(curl -s http://localhost:8080/actuator/health || true)
            if echo "$body" | grep -q '"status":"UP"'; then ready=true; break; fi
            sleep 2
          done
          echo "health: $body"
          test "$ready" = "true"
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/mdm/materials)
          echo "unauthenticated status: $code"
          test "$code" = "401"
      - name: Login smoke (admin via JWT)
        run: |
          resp=$(curl -s -X POST http://localhost:8080/api/auth/login -H 'Content-Type: application/json' -d '{"username":"admin","password":"admin123"}')
          echo "$resp" | head -c 120; echo
          echo "$resp" | grep -q '"token"'
          token=$(echo "$resp" | sed -E 's/.*"token":"([^"]+)".*/\1/')
          # MySQL profile 不加载 H2 演示主数据（DM-*）
          demo=$(curl -s "http://localhost:8080/api/mdm/materials?keyword=DM-" -H "Authorization: Bearer $token")
          echo "$demo" | head -c 200; echo
          echo "$demo" | grep -q '"total":0'
      - name: App log
        if: always()
        run: tail -n 200 app.log || true
