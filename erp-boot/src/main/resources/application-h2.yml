spring:
  datasource:
    url: jdbc:h2:mem:erp;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  h2:
    console:
      enabled: true
  sql:
    init:
      # H2 额外加载演示主数据；MySQL profile 只用 application.yml 里的 schema + data（admin/角色/权限）
      data-locations: classpath:db/data.sql,classpath:db/demo-data.sql
