server:
  port: 8080

spring:
  application:
    name: erp
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:h2}
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
  autoconfigure:
    # Redis 已引入依赖，暂未使用；需要时去掉此排除并配置 spring.data.redis
    exclude: org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

erp:
  jwt:
    secret: ${ERP_JWT_SECRET:change-me-please-this-is-a-dev-only-secret-32bytes}
    expire-minutes: 120
  init:
    admin-password: ${ERP_ADMIN_PASSWORD:admin123}
